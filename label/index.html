<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>관 벽 라벨링</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2314314f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27none%27 stroke=%27%23ffa657%27 stroke-width=%273%27/%3E%3C/svg%3E">
<!--
  전문가 라벨링 페이지 — 전개도 위에 손가락으로 결함 구역을 칠하고 라벨을 단다 (2026-10-02).
  갤럭시 탭 · 크롬 기준. 서버 없음(GitHub Pages) — 결과는 이 탭의 localStorage 에 자동 저장되고
  "보내기" 로 JSON(+그림)을 공유 시트로 내보낸다.

  구역 규칙(사용자 요청):
    · 전개도를 한 번 누르면 붓 크기만 한 작은 구역(얇은 실선)이 생긴다
    · 그 뒤로 칠하기는 구역에 닿는 터치만 먹는다 — 밖을 눌러도 아무 일 없다(잘못 누름 방지)
    · 지우개는 반대로 바깥에서 시작해 깎아 들어간다 — 지금 고치는 구역만 깎인다
    · 만든 구역을 누르면 다시 고친다(넓히기 · 깎기 · 라벨 바꾸기) — ✓ 저장 · ✕ 그대로
    · 손가락 둘 = 옮기기 · 확대(붓 아님) · ⌫(백스페이스) = 되돌리기 · Enter = ✓ · + / − = 붓 크기
    · 라벨 기본값 = 부식(새 구역마다 골라져 있다) · 전개도 위 ▼ = 지금 영상이 보는 자리
    · 한 화면에 전개도 · 영상 · 구역 체크가 다 보이게(아래 판은 높이 고정, 남는 높이는 전개도)
    · 오른쪽 위 💾 저장하기 — 자동 저장과 같은 곳에 쓰고 다시 읽어 확인한 뒤 "✓ 저장됨" (Ctrl+S 도 같다)
      UPLOAD_URL 이 있으면 이 기기에 구역이 있는 관을 모두 네 구글 드라이브로 올린다(label/apps_script/Code.gs)
    · 실시간 — UPLOAD_URL 이 있으면 ✓ · 지우기 뒤 3초에 지금 관을 자동으로 올린다(끊기면 30초마다 다시)
    · 보는 사람 — 맨 위 사람 태그(👥 이름 구역수): 드라이브의 다른 사람 최신본을 빗금으로 겹치고 15초마다 새로 받는다. 누르면 보이기/숨기기.
      태그는 읽기 열쇠를 넣은 브라우저에만 보인다 — 처음 한 번은 주소에 ?view=all 을 붙여 열고 열쇠를 넣는다
    · 저장본 지키기 — 바뀐 게 없으면 안 쓴다 · 쓰기 전에 저장본과 합친다 · 지운 구역은 표시해 되살리지 않는다
    · 라벨은 구역마다 하나(원형 버튼). 같은 라벨은 면적이 합쳐져 막대그래프로 — 처음엔 깨끗함 100%
  화면 그리기: 구역은 그림 사각형 안으로 잘라 그리고, 테두리는 칠한 면 **안쪽 가장자리**에 긋는다
  (테두리 = 면적으로 세는 경계. 전에는 바깥에 그어 그림 끝 밖으로 삐져나왔다 — 2026-10-02 사용자).

  자료는 label/build.py 가 dashboard/data 에서 뽑는다 (data/<이름>.jpg · .seen.png · .json · .mp4).
-->
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3; --mute:#8b949e; --acc:#58a6ff; --ok:#3fb950; --bad:#f85149; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; overscroll-behavior:none; }
  /* 한 화면에 전개도 · 영상 · 구역 체크가 다 보이게 — 아래 판은 높이를 정하고, 남는 높이를 전개도가 쓴다 (2026-10-02 사용자) */
  body{ display:flex; flex-direction:column; height:100dvh; overflow:auto; }
  header{ display:flex; align-items:center; gap:8px; padding:5px 12px; border-bottom:1px solid var(--line); flex:0 0 auto; flex-wrap:wrap; }
  header h1{ font-size:15px; margin:0; white-space:nowrap; }
  header h1 small{ color:var(--mute); font-weight:400; font-size:12px; margin-left:6px; }
  #tabs{ display:flex; gap:5px; }
  #tabs button{ background:var(--panel); color:var(--mute); border:1px solid var(--line); border-radius:7px; padding:5px 10px; font-size:13px; }
  #tabs button[aria-current=true]{ background:#14314f; color:var(--ink); border-color:var(--acc); }
  .saveBox{ margin-left:auto; display:flex; align-items:center; gap:8px; }   /* 줄이 넘어가도 오른쪽에 붙는다 */
  #saveState{ color:var(--mute); font-size:12px; white-space:nowrap; }
  #saveState.bad{ color:var(--bad); }
  #saveState.warn{ color:#e3b341; }
  /* 저장하기 — 자동 저장이 있어도 손으로 눌러 확인받는 자리(2026-10-02 사용자 "심리적으로") */
  #btnSave{ min-height:30px; padding:3px 14px; border-radius:8px; border:1px solid #2ea043; background:#12261b; color:#d2f4dc; font-size:13.5px; font-weight:600; white-space:nowrap; transition:background .2s; }
  #btnSave.saved{ background:#1f6f3a; color:#fff; }
  #btnSave.fail{ background:#5a1f1f; border-color:#8a2b2b; color:#fff; }
  #btnSave.warn{ background:#4d3a12; border-color:#9e6a03; color:#fff; }
  #btnSave:disabled{ opacity:.8; }

  #stage{ position:relative; flex:1 1 auto; min-height:220px; background:#07090d; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  .zoomBtns{ position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:5px; }
  .zoomBtns button{ width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:rgba(22,27,34,.9); color:var(--ink); font-size:18px; }
  #hint{ position:absolute; left:46px; bottom:26px; color:#b9c3cf; font-size:11.5px; background:rgba(13,17,23,.75); padding:2px 7px; border-radius:6px; pointer-events:none; }
  #toast{ position:absolute; left:50%; bottom:30px; transform:translateX(-50%); background:rgba(248,81,73,.92); color:#fff; padding:6px 12px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  #toast.on{ opacity:1; }
  #toast.good{ background:rgba(63,185,80,.92); }

  /* 도구 줄 — 전개도 바로 밑. 칠하기 / 지우개 · 붓 크기 · 되돌리기 */
  #tools{ flex:0 0 auto; display:flex; align-items:center; gap:6px 12px; padding:4px 12px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button{ min-height:38px; padding:4px 14px; background:#0d1117; color:var(--mute); border:0; font-size:14px; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button[aria-pressed=true]{ background:#14314f; color:var(--ink); box-shadow:inset 0 0 0 2px var(--acc); }
  #tools .size{ display:flex; align-items:center; gap:8px; flex:1 1 240px; max-width:480px; color:var(--mute); font-size:12.5px; white-space:nowrap; }
  #brush{ flex:1; min-width:110px; height:30px; accent-color:var(--acc); }
  #brushDot{ width:40px; height:40px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:8px; background:#07090d; }
  #brushDot i{ display:block; border-radius:50%; border:1px solid #fff; background:rgba(255,255,255,.2); }
  #brushDot.erase i{ border-style:dashed; border-color:#ffb3b3; background:transparent; }
  #brushCm{ min-width:70px; }
  #btnUndo{ margin-left:auto; min-height:38px; padding:4px 12px; border-radius:8px; border:1px solid var(--line); background:#21262d; color:var(--ink); font-size:14px; display:inline-flex; align-items:center; gap:7px; }
  #btnUndo:disabled{ opacity:.4; }
  /* 다른 라벨러 태그 — 맨 위 관 탭 옆. 읽기 열쇠가 있는 브라우저(또는 ?view=all)에만 보인다 (2026-10-02 사용자 "위에 태그") */
  #people{ display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
  #people .ptag{ background:var(--panel); color:var(--mute); border:1px dashed #57606a; border-radius:999px; padding:4px 11px; font-size:13px; white-space:nowrap; }
  #people .ptag[aria-pressed=true]{ color:var(--ink); border:1px solid #e3b341; background:repeating-linear-gradient(135deg, rgba(227,179,65,.22) 0 4px, transparent 4px 8px); }
  #people .ptag small{ color:var(--mute); margin-left:5px; }
  #people .ptag[aria-pressed=true] small{ color:#f0d58a; }
  #othersBox{ margin-top:8px; font-size:12px; color:var(--ink); display:flex; flex-direction:column; gap:3px; }
  #othersBox .sw{ margin:0 2px 0 5px; vertical-align:-1px; }
  .warnTxt{ color:#e3b341; }
  kbd{ font:11px ui-monospace,Consolas,monospace; border:1px solid #57606a; border-bottom-width:2px; border-radius:4px; padding:0 4px; color:var(--mute); }

  /* 아래 판 — 구역 체크 | 영상 | 면적·목록. 칸마다 넘치면 그 칸 안에서만 스크롤 */
  #panel{ flex:0 0 auto; height:min(300px, 40dvh); padding:8px 12px; display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:10px; overflow:hidden; }
  section{ background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 10px; min-width:0; min-height:0; overflow:auto; }
  section h2{ font-size:12.5px; color:var(--mute); margin:0 0 6px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hint{ color:var(--mute); font-size:11.5px; font-weight:400; }

  #labelBoxes{ display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin:0 0 7px; }
  #labelBoxes label{ display:flex; align-items:center; gap:6px; padding:4px 7px; border:1px solid var(--line); border-radius:7px; background:#0d1117; font-size:13px; min-height:34px; white-space:nowrap; overflow:hidden; }
  #labelBoxes label.on{ border-color:var(--acc); background:#14314f; }
  #labelBoxes input{ width:18px; height:18px; margin:0; accent-color:var(--acc); flex:0 0 auto; }
  .sw{ display:inline-block; width:11px; height:11px; border-radius:2px; flex:0 0 auto; }
  .btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .btns button, .btns label.btn{ min-height:38px; padding:5px 12px; border-radius:8px; border:1px solid var(--line); background:#21262d; color:var(--ink); font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  .btns.small button, .btns.small label.btn{ min-height:32px; padding:3px 9px; font-size:12.5px; }
  .btns button:disabled{ opacity:.4; }
  button.v{ background:#1f6f3a; border-color:#2ea043; font-weight:700; flex:1 1 120px; justify-content:center; }
  button.v kbd{ color:#cfe9d6; border-color:#5fb27a; }
  button.x{ background:#5a1f1f; border-color:#8a2b2b; }
  #regState{ font-weight:400; color:var(--acc); }
  #secVid{ display:flex; flex-direction:column; overflow:hidden; }
  #vid{ display:block; flex:1 1 0; min-height:0; width:100%; object-fit:contain; background:#000; border-radius:6px; }

  #bars{ display:flex; flex-direction:column; gap:3px; }
  .bar{ display:grid; grid-template-columns:76px 1fr 92px; align-items:center; gap:6px; font-size:12px; }
  .bar > span:first-child{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .trk{ height:11px; background:#0d1117; border-radius:3px; overflow:hidden; border:1px solid #262c35; }
  .bar .fill{ height:100%; min-width:0; border-radius:2px; transition:width .25s; }
  .bar .num{ text-align:right; color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bar.lead .num{ color:var(--ink); font-weight:600; }

  #regList{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px; }
  #regList li{ display:flex; align-items:center; gap:6px; padding:3px 6px; border:1px solid var(--line); border-radius:7px; background:#0d1117; font-size:12.5px; }
  #regList li .t{ flex:1; }
  #regList li button{ min-height:28px; padding:2px 8px; border-radius:6px; border:1px solid var(--line); background:#21262d; color:var(--ink); font-size:12px; }
  #regList li.sel{ border-color:var(--acc); background:#11233a; }
  input[type=file]{ display:none; }

  /* 세로로 든 탭 · 좁은 화면 — 구역 체크와 영상은 나란히, 면적·목록은 밑에. 넘치면 페이지가 스크롤된다 */
  @media (max-width:900px){
    #panel{ height:auto; grid-template-columns:1fr 1fr; overflow:visible; }
    #secRight{ grid-column:1 / -1; }
    #vid{ flex:none; height:auto; aspect-ratio:16/9; max-height:240px; }
  }
  @media (max-width:1000px){ header h1 small{ display:none; } }
  @media (max-width:560px){
    #panel{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>관 벽 라벨링 <small>전개도 위에 결함 구역을 칠하고 라벨을 단다</small></h1>
  <nav id="tabs"></nav>
  <nav id="people" hidden aria-label="다른 라벨러"></nav>
  <div class="saveBox"><span id="saveState"></span>
  <button id="btnSave" title="지금 구역들을 이 브라우저에 저장하고, 다시 읽어 확인한다 — 완료할 때마다 자동으로도 저장된다 · Ctrl+S">💾 저장하기</button></div>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div class="zoomBtns"><button id="zIn" title="확대">＋</button><button id="zOut" title="축소">－</button><button id="zFit" title="전체 보기 ↔ 꽉 채움">⤢</button></div>
  <div id="hint">한 손가락 칠하기 · 두 손가락 옮기기·확대 · 구역 누르면 고치기 · ▼ 지금 영상 위치</div>
  <div id="toast"></div>
</div>

<div id="tools">
  <div class="seg" role="group" aria-label="도구">
    <button id="tPaint" aria-pressed="true" title="구역 안쪽에서 끌어 넓힌다">🖌️ 칠하기</button>
    <button id="tErase" aria-pressed="false" title="바깥에서 시작해 구역을 깎는다 — 지금 고치는 구역만">🧽 지우개</button>
  </div>
  <label class="size"><span>붓 크기 <kbd>−</kbd><kbd>+</kbd></span><input type="range" id="brush" min="0" max="100" step="1" value="51"></label>
  <span id="brushDot" title="지금 화면에서의 붓 크기"><i></i></span><span id="brushCm" class="hint"></span>
  <button id="btnUndo" title="마지막 획을 되돌린다 — 키보드 백스페이스로도">↶ 되돌리기 <kbd>⌫</kbd></button>
</div>

<div id="panel">
  <section id="secLabel">
    <h2>구역 — <span id="regState"></span></h2>
    <div id="labelBoxes" role="radiogroup" aria-label="라벨"></div>
    <div class="btns">
      <button id="btnX" class="x" title="새 구역은 버리고, 고치던 구역은 고치기 전으로">✕ 취소</button>
      <button id="btnV" class="v" title="고른 라벨로 구역을 확정한다 — 키보드 Enter 로도">✓ 완료 <kbd>Enter</kbd></button>
    </div>
    <div class="hint" style="margin-top:6px">안쪽에서 끌어 넓히기 · 지우개는 바깥부터 깎기 · 라벨 기본값 = 부식</div>
  </section>

  <section id="secVid">
    <h2>영상 <span class="hint" id="vidHint"></span></h2>
    <video id="vid" controls playsinline preload="metadata"></video>
  </section>

  <section id="secRight">
    <h2>면적 비율 <span class="hint" id="chartDen"></span></h2>
    <div id="bars"></div>
    <div id="othersBox" hidden></div>
    <h2 style="margin-top:9px">완료한 구역 <span id="nReg"></span> <span class="hint">— 누르면 고친다</span></h2>
    <ol id="regList"></ol>
    <div class="btns small" style="margin-top:6px">
      <button id="btnShare" title="JSON 과 그림을 공유 시트로 보낸다">📤 보내기</button>
      <button id="btnCopy" title="JSON 을 클립보드로">복사</button>
      <label class="btn" title="보낸 JSON 을 다시 불러온다">불러오기<input type="file" id="fileIn" accept=".json,.txt,application/json,text/plain"></label>
      <button id="btnClear" title="이 관의 구역을 전부 지운다">전부 지우기</button>
    </div>
    <div class="hint" style="margin-top:4px">이 브라우저에 자동 저장 · 다 하면 <b>보내기</b>로 전달해 주세요</div>
  </section>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const LABELS=[
  {key:'coating_peel', ko:'박리(도장)', color:'#ff5c8a'},
  {key:'corrosion',    ko:'부식',       color:'#f2cc60'},
  {key:'nodule',       ko:'결절',       color:'#ffa657'},
  {key:'rust_deposit', ko:'녹 침착',    color:'#e8590c'},
  {key:'slime',        ko:'슬라임',     color:'#39d0d8'},
  {key:'sediment',     ko:'침전물',     color:'#d2a8ff'},
  {key:'deformation',  ko:'변형',       color:'#79c0ff'},
  {key:'crack',        ko:'균열',       color:'#ffffff'},
  {key:'other',        ko:'기타',       color:'#9aa4b2'},
];
const CLEAN={key:'clean', ko:'깨끗함', color:'#3fb950'};
const LBY=Object.fromEntries(LABELS.map(l=>[l.key,l]));
const R_MIN=1, R_MAX=60;      // 붓 반지름(그림 화소) — 막대는 로그 눈금이라 작은 붓도 고르기 쉽다
const A_ON=128;               // 면적으로 세는 화소 = 마스크 불투명도 절반 이상(가장자리 흐림은 반만)
const DEFAULT_LABEL='corrosion';   // 라벨 기본값 — 새 구역마다 이것이 골라져 있다(2026-10-02 사용자 "기본은 부식"). 바꾸려면 여기만
let UPLOAD_URL='https://script.google.com/macros/s/AKfycbw0iV5R3_O-wIPcJmrzHCYIbAEYlDwULNXmwIEwSnqLMhymwFRi06CKinoB6_HY3w7PJg/exec';   // 결과 받는 곳 — label/apps_script/Code.gs 를 웹 앱으로 배포한 주소(…/exec). 비면 이 기기에만 저장

function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function mctx(c){ return c.getContext('2d',{willReadFrequently:true}); }
function mkCanvasR(w,h){ const c=mkCanvas(w,h); mctx(c); return c; }   // 읽기 잦은 캔버스 — 첫 getContext 에 표시해야 먹는다

// ── 자료 불러오기 ──────────────────────────────────────────────────
async function loadDataset(name, push=true){
  saveNow();                                  // 바뀐 게 있을 때만 쓴다(dirty)
  flushUpload();                              // 올리다 만 것이 있으면 이 관이 열려 있을 때 바로
  const r=await fetch(`data/${name}.json?t=${Date.now()}`, {cache:'no-store'});
  M=await r.json();
  document.title=`관 벽 라벨링 · ${M.title}`;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.name===name?'true':'false'));
  if(push){ const u=new URL(location.href); u.searchParams.set('data', name); history.replaceState(null,'',u.search); }
  IMG=await loadImage(`data/${name}.jpg`);
  const seenIm=await loadImage(`data/${name}.seen.png`);
  const sc=mkCanvasR(M.img_w, M.img_h), sg=mctx(sc); sg.imageSmoothingEnabled=false;
  sg.drawImage(seenIm,0,0,M.img_w,M.img_h);
  const px=sg.getImageData(0,0,M.img_w,M.img_h).data;
  SEEN=new Uint8Array(M.img_w*M.img_h); seenCount=0;
  for(let i=0;i<SEEN.length;i++){ if(px[i*4]>127){ SEEN[i]=1; seenCount++; } }
  maskA=mkCanvasR(M.img_w, M.img_h); scratch=mkCanvasR(M.img_w, M.img_h); work=mkCanvasR(M.img_w, M.img_h);
  for(const k in counts) delete counts[k];
  active=null; resetLabel(); vidX=null;
  regions=loadSaved(name).map(normRegion).filter(Boolean); dirty=false; pendingSync=false;
  OTHERS=[]; othersSig=''; othersErr=''; othersVer++;
  for(const rg of regions) computeRegionArea(rg);
  rebuildAll(); regVer++;
  const v=$('vid'); v.src=`data/${M.video}`; v.load();
  $('vidHint').textContent='— 구역을 찍으면 그 자리 장면으로 · 전개도 ▼ = 지금 영상 위치';
  $('chartDen').textContent=`— 분모 = 본 벽 ${M.seen_m2.toFixed(2)} m²`;
  $('chartDen').title=`계기가 본 벽 ${M.seen_m2.toFixed(2)} m² (어둡게 빈 곳 제외) · 관경 ${M.pipe_dia_mm} mm · 길이 ${(M.len_mm/1000).toFixed(2)} m`;
  resize(); fitView(); updateUI(); render();
  if(othersOn) fetchOthers(); showOthers();
}
function loadImage(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
// 저장본 · 불러온 파일을 지금 형식으로 — 예전 판(라벨 여러 개 고를 수 있던 때)의 구역도 그대로 읽는다
function normRegion(r){
  if(!r || !Array.isArray(r.strokes)) return null;
  const labels=Array.isArray(r.labels) ? r.labels.filter(k=>LBY[k]) : (r.label && LBY[r.label] ? [r.label] : []);
  const strokes=r.strokes.filter(s=>s && Array.isArray(s.pts) && s.pts.length && +s.r>0)
                         .map(s=>s.erase ? {r:+s.r, pts:s.pts, erase:true} : {r:+s.r, pts:s.pts});
  if(!labels.length || !strokes.length) return null;
  const o={id:r.id||(Date.now()+Math.random()), labels, strokes, at:r.at||new Date().toISOString()};
  if(r.edited_at) o.edited_at=r.edited_at;
  return o;
}

// GitHub Pages 는 페이지를 10분 캐시한다(max-age=600, 바꿀 수 없다). 열 때 한 번 새 판이 있는지 묻고 있으면 새로 받는다.
// 이때는 아직 아무것도 안 그렸으니 잃을 것이 없다. 저장본(localStorage)은 주소가 같으니 그대로 읽힌다
async function newerBuild(){
  if(BUILD.startsWith('__')) return false;
  try{
    const j=await (await fetch(`version.json?t=${Date.now()}`, {cache:'no-store'})).json();
    if(!j.v || j.v===BUILD) return false;
    const u=new URL(location.href);
    if(u.searchParams.get('v')===j.v) return false;      // 이미 그 판을 달라고 했는데도 옛 판이면 그만(되풀이 방지)
    u.searchParams.set('v', j.v); location.replace(u.toString()); return true;
  }catch(e){ return false; }
}
async function init(){
  if(await newerBuild()) return;
  const list=await (await fetch(`data/index.json?t=${Date.now()}`,{cache:'no-store'})).json();
  DATASETS=list;
  try{ const u=localStorage.getItem('pipelabel:uploaded'); if(u) lastUploaded=new Date(u); }catch(e){}

  for(const d of list){
    const b=document.createElement('button'); b.textContent=d.title; b.dataset.name=d.name;
    b.onclick=()=>{ if(active && !confirm('칠하던 구역이 아직 완료되지 않았어요. 버리고 옮길까요?')) return; active=null; loadDataset(d.name); };
    tabs.appendChild(b);
  }
  // 라벨 — 원형 버튼(라디오). 구역마다 하나만

  for(const l of LABELS){
    const lab=document.createElement('label');
    lab.innerHTML=`<input type="radio" name="lab" value="${l.key}"><i class="sw" style="background:${l.color}"></i>${l.ko}`;
    lab.querySelector('input').addEventListener('change',()=>{ syncChecks(); updateUI(); render(); });
    box.appendChild(lab);
  }
  try{ const b=localStorage.getItem('pipelabel:brush'); if(b!==null) $('brush').value=b; }catch(e){}
  const q=new URLSearchParams(location.search).get('data');

  if(UPLOAD_URL && !VIEW_ALL && !readKey(false) && !labeler(false)){ labeler(true); showSaveState(); }   // 결과가 자동으로 올라가니 이름을 먼저 받아 둔다(보는 사람은 안 묻는다)
  if(peopleVisible()){ if(readKey(false)) setOthers(true); else renderPeople(); }   // 열쇠가 있는 브라우저는 열자마자 다른 라벨러를 받아 온다
}

// ── 저장 ──────────────────────────────────────────────────────────
function skey(name){ return 'pipelabel:'+name; }
function readStored(name){
  try{ const j=JSON.parse(localStorage.getItem(skey(name))||'null'); if(j && Array.isArray(j.regions)) return j; }catch(e){}
  return null;
}
function loadSaved(name){
  lastSaved=null; tomb=new Set();
  const j=readStored(name); if(!j) return [];
  if(j.saved_at) lastSaved=new Date(j.saved_at);
  for(const id of (j.deleted||[])) tomb.add(id);
  return j.regions;
}
// 두 목록을 합친다 — id 로 합집합, 같은 id 는 나중에 고친 쪽, 지운 표시(tomb)는 뺀다. 만든 순서대로
function rStamp(r){ return r.edited_at || r.at || ''; }
function mergeRegions(mine, theirs){
  const by=new Map();
  for(const r of theirs) if(!tomb.has(r.id)) by.set(r.id, r);
  for(const r of mine){ if(tomb.has(r.id)) continue; const o=by.get(r.id); if(!o || rStamp(r)>=rStamp(o)) by.set(r.id, r); }
  return [...by.values()].sort((a,b)=> (a.at||'')<(b.at||'') ? -1 : (a.at||'')>(b.at||'') ? 1 : 0);
}
// 저장본과 합쳐 이 탭 목록을 바꾼다. 저장본에 없던 것이 이 탭에 있으면 true(다시 써야 한다)
function absorbStored(){
  const cur=readStored(M.name); if(!cur) return regions.length>0;
  for(const id of (cur.deleted||[])) tomb.add(id);
  const theirs=cur.regions.map(normRegion).filter(Boolean);
  const merged=mergeRegions(regions, theirs);
  const before=new Set(regions), fresh=merged.filter(r=>!before.has(r));
  const changed = fresh.length>0 || merged.length!==regions.length;
  if(changed){ for(const r of fresh) computeRegionArea(r); regions=merged; rebuildAll(); regVer++; }
  const theirById=new Map(theirs.map(r=>[r.id, rStamp(r)]));
  return merged.some(r=>theirById.get(r.id)!==rStamp(r)) || theirs.some(r=>tomb.has(r.id));
}
// 저장 — force 가 아니면 바뀐 게 있을 때만(dirty) 쓴다. 쓰기 전에 저장본과 합치고, 쓰고 나서 다시 읽어 구역 수를 맞춰 본다
function saveNow(force){
  if(!M) return false;
  if(!force && !dirty){ showSaveState(); return !saveFailed; }
  try{
    absorbStored();
    const rs=regions.map(r=>({id:r.id, labels:r.labels, strokes:r.strokes, at:r.at, ...(r.edited_at?{edited_at:r.edited_at}:{})}));
    const at=new Date();
    localStorage.setItem(skey(M.name), JSON.stringify({regions:rs, deleted:[...tomb], saved_at:at.toISOString()}));
    const back=JSON.parse(localStorage.getItem(skey(M.name))||'null');
    if(!back || !Array.isArray(back.regions) || back.regions.length!==rs.length) throw new Error('다시 읽은 구역 수가 다름');
    lastSaved=at; saveFailed=false; dirty=false;
  }catch(e){ saveFailed=true; }
  showSaveState();
  return !saveFailed;
}
function changed(){ dirty=true; const ok=saveNow(); if(ok) scheduleUpload(); return ok; }   // 이 탭에서 구역이 바뀌었다 — 바로 쓰고, 드라이브엔 3초 뒤
// 다른 탭(같은 기기)이 이 관을 저장했다 — 합쳐서 따라간다. 이 탭에만 있는 구역이 있으면(옛 탭이 덮었다) 다시 쓴다
function syncFromStorage(){
  pendingSync=false;
  if(!M) return;
  const need=absorbStored();
  if(need){ dirty=true; saveNow(); }
  else { const cur=readStored(M.name); if(cur && cur.saved_at) lastSaved=new Date(cur.saved_at); }
  updateUI(); render();
}
window.addEventListener('storage', e=>{
  if(!M || e.key!==skey(M.name)) return;
  if(active){ pendingSync=true; return; }      // 칠하는 중이면 끝난 뒤에
  syncFromStorage();
});
function hhmm(d){ const p=n=>String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function showSaveState(){
  if(!M) return;
  const el=$('saveState'), who=labeler(false);
  el.classList.toggle('bad', saveFailed);
  el.classList.toggle('warn', !saveFailed && !!UPLOAD_URL && upFail);
  el.style.cursor = UPLOAD_URL ? 'pointer' : '';
  el.title = UPLOAD_URL ? '누르면 이름을 바꾼다' : '';
  if(saveFailed){ el.textContent='저장 못 함 — 보내기로 파일을 받아 두세요'; return; }
  const parts=[];
  if(UPLOAD_URL && who) parts.push(who);
  if(UPLOAD_URL) parts.push(upFail ? '⚠ 업로드 대기(인터넷 확인)' : lastUploaded ? `${hhmm(lastUploaded)} 업로드` : '아직 안 올림');
  else if(lastSaved) parts.push(`${hhmm(lastSaved)} 저장`);
  parts.push(`구역 ${regions.length}`);
  el.textContent=parts.join(' · ');
}
$('saveState').onclick=()=>{
  if(!UPLOAD_URL) return;
  const n=prompt('이름(올린 결과 파일 이름에 들어갑니다)', labeler(false));
  if(n!==null && n.trim()){ try{ localStorage.setItem('pipelabel:labeler', n.trim()); }catch(e){} showSaveState(); }
};

// ── 업로드 — 네 구글 드라이브(앱스 스크립트 웹 앱, label/apps_script/Code.gs)로. 주소가 비면 이 기기에만 저장 ──
function labeler(ask){
  let n=''; try{ n=localStorage.getItem('pipelabel:labeler')||''; }catch(e){}
  if(!n && ask){
    n=(prompt('이름을 적어 주세요 — 올린 결과 파일 이름에 들어갑니다', '')||'').trim();
    if(n){ try{ localStorage.setItem('pipelabel:labeler', n); }catch(e){} }
  }
  return n;
}
// 올릴 것 — 지금 열린 관은 면적 요약까지, 다른 관은 이 기기 저장본의 구역(획) 그대로
function payloadFor(name){
  if(M && name===M.name) return exportJSON();
  const j=readStored(name); if(!j) return null;
  const d=DATASETS.find(x=>x.name===name)||{name};
  return {format:'pipe-label/2', dataset:name, title:d.title, exported_at:new Date().toISOString(), saved_at:j.saved_at,
          regions:j.regions, deleted:j.deleted||[], ua:navigator.userAgent,
          note:'저장하기 때 열려 있지 않은 관이라 면적 요약 없이 구역(획)만 — 페이지에서 불러오면 다시 센다'};
}
async function postOne(p){
  const r=await fetch(UPLOAD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(p)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'받는 쪽이 거절');
  return j;
}
function flashSave(cls, text, ms){
  const b=$('btnSave'); clearTimeout(flashSave._t);
  b.classList.remove('saved','fail','warn'); if(cls) b.classList.add(cls); b.textContent=text;
  flashSave._t=setTimeout(()=>{ b.classList.remove('saved','fail','warn'); b.textContent='💾 저장하기'; }, ms||2400);
}
// 실시간 올리기 — 바뀔 때마다 3초 기다렸다 지금 관을 올린다(연달아 바뀌면 마지막 한 번). 끊기면 30초마다 · 인터넷이 돌아오면 다시
let upT=0, upName=null, upBusy=false, upAgain=false, upFail=false;
function scheduleUpload(){
  if(!UPLOAD_URL || !M || !labeler(false)) return;
  upName=M.name; clearTimeout(upT); upT=setTimeout(()=>autoUpload(upName), 3000);
}
function flushUpload(){ if(upName && upT){ clearTimeout(upT); upT=0; autoUpload(upName); } }   // 관을 옮기기 전에 남은 것을 바로
async function autoUpload(name){
  upT=0;
  if(upBusy){ upAgain=true; return; }
  const p=payloadFor(name); if(!p) return;          // 지금 관이면 면적 요약까지 — 기다리기 전에 만든다
  p.labeler=labeler(false); p.trigger='auto';
  upBusy=true;
  try{
    await postOne(p);
    lastUploaded=new Date(); upFail=false; if(upName===name) upName=null;
    try{ localStorage.setItem('pipelabel:uploaded', lastUploaded.toISOString()); }catch(e){}
  }catch(err){
    console.warn('자동 업로드 실패', err); upFail=true; upName=name;
    clearTimeout(upT); upT=setTimeout(()=>autoUpload(name), 30000);
  }finally{
    upBusy=false; showSaveState();
    if(upAgain){ upAgain=false; scheduleUpload(); }
  }
}
window.addEventListener('online', ()=>{ if(upFail && upName) autoUpload(upName); });

// ── 다른 라벨러 보기(읽기) — 받는 스크립트에 열쇠를 건네 이 관의 최신본들을 받아 온다. 열쇠는 이 브라우저에만 ──
function readKey(ask){
  let k=''; try{ k=localStorage.getItem('pipelabel:readkey')||''; }catch(e){}
  if(!k && ask){ k=(prompt('읽기 열쇠를 붙여 넣어 주세요 (보는 사람용 — 한 번만)', '')||'').trim(); if(k){ try{ localStorage.setItem('pipelabel:readkey', k); }catch(e){} } }
  return k;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function fetchOthers(){
  if(!othersOn || !M || !UPLOAD_URL) return;
  const key=readKey(false); if(!key){ setOthers(false); return; }
  const name=M.name;
  try{
    const r=await fetch(UPLOAD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({op:'read', key, dataset:name})});
    const j=await r.json();
    if(!M || M.name!==name || !othersOn) return;               // 그사이 관을 옮겼거나 껐다
    if(!j.ok){
      if(/열쇠/.test(j.error||'')){ try{ localStorage.removeItem('pipelabel:readkey'); }catch(e){} setOthers(false); toast('읽기 열쇠가 틀려요 — 다시 켜고 넣어 주세요'); }
      else { othersErr='읽기 길이 아직 안 열렸어요(받는 스크립트 새 버전 배포 필요)'; showOthers(); }
      return;
    }
    const me=labeler(false);
    const list=(j.files||[]).filter(f=>f.data && f.labeler!==me).map(f=>({
      labeler:String(f.labeler), modified:f.modified,
      regions:(Array.isArray(f.data.regions)?f.data.regions:[]).map(normRegion).filter(Boolean)}));
    const sig=JSON.stringify(list.map(o=>[o.labeler, o.modified, o.regions.length]));
    othersErr='';
    if(sig!==othersSig){ othersSig=sig; OTHERS=list; computeOthers(); othersVer++; render(); }
    showOthers();
  }catch(e){ othersErr='읽기 실패 — 인터넷 확인'; showOthers(); }
}
function computeOthers(){
  for(const o of OTHERS){
    o.per={};
    for(const l of LABELS){ const rs=o.regions.filter(r=>r.labels.includes(l.key)); if(rs.length){ paintInto(work, rs); o.per[l.key]=countSeenBox(work, FULL()); } }
    if(o.regions.length){ paintInto(work, o.regions); o.union=countSeenBox(work, FULL()); } else o.union=0;
  }
}
// 맨 위 사람 태그 — 열쇠가 없으면 "다른 라벨러 보기"(누르면 열쇠를 한 번 묻는다), 있으면 사람마다 태그(누르면 보이기/숨기기)
function peopleVisible(){ return !!UPLOAD_URL && (VIEW_ALL || !!readKey(false)); }
function renderPeople(){
  const nav=$('people');
  if(!peopleVisible()){ nav.hidden=true; nav.innerHTML=''; return; }
  nav.hidden=false;
  if(!othersOn) nav.innerHTML='<button class="ptag" data-act="on" title="읽기 열쇠가 필요하다(이 브라우저에 한 번만)">👥 다른 라벨러 보기</button>';
  else if(othersErr) nav.innerHTML=`<button class="ptag" data-act="retry" title="${esc(othersErr)} — 누르면 다시">⚠ 다른 라벨러 읽기 안 됨</button>`;
  else if(!OTHERS.length) nav.innerHTML='<span class="ptag" title="15초마다 다시 본다">👥 이 관엔 아직 없음</span>';
  else nav.innerHTML=OTHERS.map((o,i)=>{
    const t=new Date(o.modified), when=isNaN(t)?'':` · ${hhmm(t)} 올림`;
    return `<button class="ptag" data-i="${i}" aria-pressed="${!hiddenPeople.has(o.labeler)}" title="${esc(o.labeler)} — 구역 ${o.regions.length}${when} · 누르면 보이기/숨기기">👥 ${esc(o.labeler)}<small>${o.regions.length}</small></button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.act==='on'){ if(readKey(true)) setOthers(true); else renderPeople(); return; }
    if(b.dataset.act==='retry'){ fetchOthers(); return; }
    const o=OTHERS[+b.dataset.i]; if(!o) return;
    if(hiddenPeople.has(o.labeler)) hiddenPeople.delete(o.labeler); else hiddenPeople.add(o.labeler);
    try{ localStorage.setItem('pipelabel:hiddenPeople', JSON.stringify([...hiddenPeople])); }catch(e){}
    othersVer++; render(); renderPeople();
  });
}
function showOthers(){
  renderPeople();
  const box=$('othersBox');
  if(!peopleVisible() || !othersOn){ box.hidden=true; return; }
  box.hidden=false;
  if(othersErr){ box.innerHTML=`<span class="warnTxt">${esc(othersErr)}</span>`; return; }
  if(!OTHERS.length){ box.textContent='👥 이 관에 다른 사람이 올린 라벨이 아직 없다'; return; }
  const pct=n=>seenCount?100*n/seenCount:0;
  box.innerHTML=OTHERS.map(o=>{
    const parts=LABELS.filter(l=>o.per[l.key]).map(l=>`<i class="sw" style="background:${l.color}"></i>${l.ko} ${pct(o.per[l.key]).toFixed(2)}%`);
    const t=new Date(o.modified);
    return `<div>👥 <b>${esc(o.labeler)}</b> · ${isNaN(t)?'':hhmm(t)+' 올림 · '}구역 ${o.regions.length} — 깨끗함 ${(100-pct(o.union)).toFixed(1)}%${parts.map(x=>' · '+x).join('')}</div>`;
  }).join('');
}
function setOthers(on){
  othersOn=on; clearInterval(othersT); othersT=0;
  try{ localStorage.setItem('pipelabel:others', on?'1':'0'); }catch(e){}
  if(on){ fetchOthers(); othersT=setInterval(()=>{ if(document.visibilityState==='visible') fetchOthers(); }, 15000); }
  else { OTHERS=[]; othersSig=''; othersErr=''; othersVer++; render(); }
  showOthers();
}

async function doSave(){

  if(!saveNow(true)){ flashSave('fail','✕ 저장 실패'); toast('저장 못 했어요 — 보내기로 파일을 받아 두세요'); return; }

}
$('btnSave').onclick=doSave;

// ── 화면 ──────────────────────────────────────────────────────────
function resize(){
  dpr=window.devicePixelRatio||1;
  const st=$('stage'), w=st.clientWidth, h=st.clientHeight;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  [offT,offE,offO,offR,offC]=[0,0,0,0,0].map(()=>mkCanvas(cv.width, cv.height));
  committedKey='';
}
function viewBox(){ return {x:PAD.l, y:PAD.t, w:cv.width/dpr-PAD.l-PAD.r, h:cv.height/dpr-PAD.t-PAD.b}; }
function fitView(){
  if(!IMG) return;
  const vb=viewBox();
  const s=Math.min(vb.w/IMG.width, vb.h/IMG.height);
  view={s, ox:vb.x+(vb.w-IMG.width*s)/2, oy:vb.y+(vb.h-IMG.height*s)/2}; fitted=true;
}
function clampView(){
  const vb=viewBox(), fit=Math.min(vb.w/IMG.width, vb.h/IMG.height);
  view.s=Math.max(fit*0.5, Math.min(16, view.s));
  const W=IMG.width*view.s, H=IMG.height*view.s;
  // 그림이 틀보다 작으면 가운데, 크면 틀 안에 적어도 1/4 은 보이게
  if(W<=vb.w) view.ox=vb.x+(vb.w-W)/2; else view.ox=Math.min(vb.x+vb.w*0.25, Math.max(vb.x+vb.w*0.75-W, view.ox));
  if(H<=vb.h) view.oy=vb.y+(vb.h-H)/2; else view.oy=Math.min(vb.y+vb.h*0.25, Math.max(vb.y+vb.h*0.75-H, view.oy));
}
function zoomAt(f, cx, cy){
  const ix=(cx-view.ox)/view.s, iy=(cy-view.oy)/view.s;
  view.s*=f; view.ox=cx-ix*view.s; view.oy=cy-iy*view.s; fitted=false; clampView(); render();
}
function toImg(cx,cy){ return [(cx-view.ox)/view.s, (cy-view.oy)/view.s]; }
function imgRectDev(){ return {x:dpr*view.ox, y:dpr*view.oy, w:dpr*IMG.width*view.s, h:dpr*IMG.height*view.s}; }
let rq=0;
function requestRender(){ if(rq) return; rq=requestAnimationFrame(()=>{ rq=0; render(); }); }

function render(){
  if(!IMG) return;
  g.setTransform(dpr,0,0,dpr,0,0);
  const cw=cv.width/dpr, ch=cv.height/dpr;
  g.fillStyle='#07090d'; g.fillRect(0,0,cw,ch);
  const vb=viewBox();
  g.save(); g.beginPath(); g.rect(vb.x,vb.y,vb.w,vb.h); g.clip();
  g.imageSmoothingEnabled=view.s<2;
  g.drawImage(IMG, view.ox, view.oy, IMG.width*view.s, IMG.height*view.s);
  renderCommitted();
  g.save(); g.setTransform(1,0,0,1,0,0); g.drawImage(offC,0,0); g.restore();
  if(active){
    // 칠하는 구역 — 고른 라벨 색으로 채우고(안 골랐으면 흰색) 흰 실선. 고치는 중이면 선을 조금 굵게
    const lab=checkedLabel();
    drawLayer(g, [active.strokes], lab?LBY[lab].color:'#ffffff', 0.28, '#ffffff', active.editId?1.5:1);
  }
  drawCursor();
  g.restore();
  drawAxes(vb);
  drawVidArrow(vb);
  updateBrushDot();
}
// 확정한 구역 — 보기·구역이 그대로면 다시 그리지 않는다(칠하는 동안 빠르게)
function renderCommitted(){
  const eid=active&&active.editId;
  const key=[view.s,view.ox,view.oy,cv.width,cv.height,regVer,eid,othersVer].join('|');
  if(key===committedKey) return;
  committedKey=key;
  const cg=offC.getContext('2d'); cg.setTransform(1,0,0,1,0,0); cg.clearRect(0,0,offC.width,offC.height);
  if(othersOn) for(const o of OTHERS) if(!hiddenPeople.has(o.labeler)) for(const l of LABELS){   // 다른 라벨러 — 빗금 · 내 구역 밑 · 태그로 숨긴 사람 빼고
    const rs=o.regions.filter(r=>r.labels.includes(l.key));
    if(rs.length) drawHatched(cg, rs.map(r=>r.strokes), l.color);
  }
  for(const l of LABELS){
    const rs=regions.filter(r=>r.labels.includes(l.key) && r.id!==eid);
    if(rs.length) drawLayer(cg, rs.map(r=>r.strokes), l.color, 0.30, l.color, 1);
  }
}
// 구역 여럿(획 묶음들)을 화면에 — 그림 사각형 안으로 잘라 옅게 채우고, 칠한 면 안쪽 가장자리에 실선.
// 지우개 획이 있는 구역은 따로 그려 붙인다(지우개가 다른 구역까지 깎지 않게)
function drawLayer(target, groups, fill, alpha, line, lwCss){
  const W=cv.width, H=cv.height;
  const tg=offT.getContext('2d');
  tg.setTransform(1,0,0,1,0,0); tg.globalCompositeOperation='source-over'; tg.clearRect(0,0,W,H);
  tg.save();
  const R=imgRectDev(); tg.beginPath(); tg.rect(R.x,R.y,R.w,R.h); tg.clip();
  paintGroups(tg, groups, offR, [dpr*view.s,0,0,dpr*view.s,dpr*view.ox,dpr*view.oy]);
  tg.restore();
  tg.globalCompositeOperation='source-in'; tg.fillStyle=fill; tg.fillRect(0,0,W,H); tg.globalCompositeOperation='source-over';
  innerOutline(offT, offE, offO, Math.max(1, Math.round(lwCss*dpr)));
  if(line!==fill){ const og=offO.getContext('2d'); og.globalCompositeOperation='source-in'; og.fillStyle=line; og.fillRect(0,0,W,H); og.globalCompositeOperation='source-over'; }
  target.save(); target.setTransform(1,0,0,1,0,0);
  target.globalAlpha=alpha; target.drawImage(offT,0,0);
  target.globalAlpha=1; target.drawImage(offO,0,0);
  target.restore();
}
// 다른 라벨러 구역 — 칠 대신 빗금 + 안쪽 실선(내 구역과 섞여도 갈린다)
function drawHatched(target, groups, color){
  const W=cv.width, H=cv.height, tg=offT.getContext('2d');
  tg.setTransform(1,0,0,1,0,0); tg.globalCompositeOperation='source-over'; tg.clearRect(0,0,W,H);
  tg.save(); const R=imgRectDev(); tg.beginPath(); tg.rect(R.x,R.y,R.w,R.h); tg.clip();
  paintGroups(tg, groups, offR, [dpr*view.s,0,0,dpr*view.s,dpr*view.ox,dpr*view.oy]);
  tg.restore();
  innerOutline(offT, offE, offO, Math.max(1, Math.round(dpr)));
  const og=offO.getContext('2d'); og.globalCompositeOperation='source-in'; og.fillStyle=color; og.fillRect(0,0,W,H); og.globalCompositeOperation='source-over';
  const pc=mkCanvas(8,8), px=pc.getContext('2d'); px.strokeStyle=color; px.lineWidth=2;
  px.beginPath(); px.moveTo(-2,10); px.lineTo(10,-2); px.moveTo(-2,2); px.lineTo(2,-2); px.moveTo(6,10); px.lineTo(10,6); px.stroke();
  tg.globalCompositeOperation='source-in'; tg.fillStyle=tg.createPattern(pc,'repeat'); tg.fillRect(0,0,W,H); tg.globalCompositeOperation='source-over';
  target.save(); target.setTransform(1,0,0,1,0,0);
  target.globalAlpha=0.8; target.drawImage(offT,0,0); target.globalAlpha=1; target.drawImage(offO,0,0);
  target.restore();
}
// 안쪽 테두리 = 면 − 깎은 면(8방향 lw 화소). 테두리가 칠한 면 밖으로 나가지 않는다
const OFFS=lw=>[[lw,0],[-lw,0],[0,lw],[0,-lw],[lw,lw],[lw,-lw],[-lw,lw],[-lw,-lw]];
function innerOutline(src, e, o, lw){
  const W=src.width, H=src.height;
  const eg=e.getContext('2d'); eg.setTransform(1,0,0,1,0,0); eg.globalCompositeOperation='source-over'; eg.clearRect(0,0,W,H); eg.drawImage(src,0,0);
  eg.globalCompositeOperation='destination-in'; for(const [dx,dy] of OFFS(lw)) eg.drawImage(src,dx,dy);
  eg.globalCompositeOperation='source-over';
  const og=o.getContext('2d'); og.setTransform(1,0,0,1,0,0); og.globalCompositeOperation='source-over'; og.clearRect(0,0,W,H); og.drawImage(src,0,0);
  og.globalCompositeOperation='destination-out'; og.drawImage(e,0,0); og.globalCompositeOperation='source-over';
}
function drawCursor(){
  const on=cursor || performance.now()<previewUntil;
  if(!on || !M) return;
  let p=cursor||lastPos; if(!p){ const vb=viewBox(); p={x:vb.x+vb.w/2, y:vb.y+vb.h/2}; }
  const r=Math.max(1.5, brushR()*view.s);
  g.save(); g.lineWidth=1;
  g.strokeStyle='rgba(0,0,0,.55)'; g.beginPath(); g.arc(p.x,p.y,r+1,0,Math.PI*2); g.stroke();
  if(tool==='erase'){ g.setLineDash([4,3]); g.strokeStyle='#ffb3b3'; } else g.strokeStyle='rgba(255,255,255,.95)';
  g.beginPath(); g.arc(p.x,p.y,r,0,Math.PI*2); g.stroke();
  g.restore();
}
function drawAxes(vb){
  g.font='11px system-ui'; g.strokeStyle='#2a313c'; g.lineWidth=1;
  const cw=cv.width/dpr, ch=cv.height/dpr;
  g.fillStyle='#07090d'; g.fillRect(0,0,PAD.l,ch); g.fillRect(0,ch-PAD.b,cw,PAD.b);
  g.fillStyle='#8b949e';
  // 세로 = 둘레(°) · 가로 = 관 길이(m)
  g.textAlign='right';
  for(let d=0; d<=360; d+=45){
    const y=view.oy+IMG.height*view.s*d/360; if(y<vb.y-4||y>vb.y+vb.h+4) continue;
    g.fillText(d+'°', PAD.l-5, y+4);
    g.beginPath(); g.moveTo(PAD.l,y); g.lineTo(PAD.l+3,y); g.stroke();
  }
  g.textAlign='center';
  const mpx=M.mm_per_px_x; const stepM = view.s*1000/mpx > 90 ? 1 : (view.s*1000/mpx>36 ? 2 : 5);
  for(let mtr=0; mtr*1000<=M.len_mm+1; mtr+=stepM){
    const x=view.ox+mtr*1000/mpx*view.s; if(x<vb.x-10||x>vb.x+vb.w+10) continue;
    g.fillText(mtr.toFixed(0)+' m', x, ch-7);
    g.beginPath(); g.moveTo(x,ch-PAD.b); g.lineTo(x,ch-PAD.b+3); g.stroke();
  }
}

// ── 칠하기 · 지우개 ──────────────────────────────────────────────────
function brushR(){ const v=+$('brush').value; return +(R_MIN*Math.pow(R_MAX/R_MIN, v/100)).toFixed(2); }
function hasErase(st){ return st.some(s=>s.erase); }
function paintStrokes(ctx, strokes){
  ctx.strokeStyle='#fff'; ctx.lineCap='round'; ctx.lineJoin='round';
  for(const s of strokes){
    if(!s.pts.length) continue;
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.lineWidth=s.r*2; ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for(let i=1;i<s.pts.length;i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
    if(s.pts.length===1) ctx.lineTo(s.pts[0][0]+0.01, s.pts[0][1]);
    ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
}
// 구역 여럿을 한 캔버스에 — 지우개 있는 구역은 tmp 에 따로 그려 붙인다. T = 그릴 때 변환
function paintGroups(ctx, groups, tmp, T){
  for(const st of groups){
    if(!hasErase(st)){ ctx.setTransform(...T); paintStrokes(ctx, st); continue; }
    const tg=tmp.getContext('2d'); tg.setTransform(1,0,0,1,0,0); tg.clearRect(0,0,tmp.width,tmp.height);
    tg.setTransform(...T); paintStrokes(tg, st); tg.setTransform(1,0,0,1,0,0);
    ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(tmp,0,0);
  }
  ctx.setTransform(1,0,0,1,0,0);
}
function redrawActive(){ const c=mctx(maskA); c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,maskA.width,maskA.height); if(active) paintStrokes(c, active.strokes); }
function stampSeg(st, x, y){
  const c=mctx(maskA); c.globalCompositeOperation=st.erase?'destination-out':'source-over';
  c.strokeStyle='#fff'; c.lineCap='round'; c.lineJoin='round'; c.lineWidth=st.r*2;
  const p=st.pts[st.pts.length-1];
  c.beginPath(); c.moveTo(p[0],p[1]); c.lineTo(x===p[0]&&y===p[1]?x+0.01:x, y); c.stroke();
  c.globalCompositeOperation='source-over';
  st.pts.push([+x.toFixed(1), +y.toFixed(1)]);
}
// 획 묶음이 칠한 범위(그림 화소, 그림 안으로 자름) — 지우개 획은 넓히지 않으니 뺀다
function strokesBBox(strokes){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const s of strokes){ if(s.erase) continue; for(const p of s.pts){
    x0=Math.min(x0,p[0]-s.r); y0=Math.min(y0,p[1]-s.r); x1=Math.max(x1,p[0]+s.r); y1=Math.max(y1,p[1]+s.r); } }
  if(x0===Infinity) return null;
  const b={x0:Math.max(0,Math.floor(x0)-1), y0:Math.max(0,Math.floor(y0)-1), x1:Math.min(M.img_w,Math.ceil(x1)+2), y1:Math.min(M.img_h,Math.ceil(y1)+2)};
  return (b.x1>b.x0 && b.y1>b.y0) ? b : null;
}
function maskEmpty(){
  if(!active) return true;
  const b=strokesBBox(active.strokes); if(!b) return true;
  const d=mctx(maskA).getImageData(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0).data;
  for(let i=3;i<d.length;i+=4) if(d[i]>=A_ON) return false;
  return true;
}
// 붓이 지금 구역에 닿는가 — 마스크의 (x,y) 둘레 r+여유 안에 칠해진 화소가 있나
function touchesActive(x,y,r){
  if(!active) return false;
  const m=Math.ceil(r)+2, x0=Math.max(0,Math.floor(x-m)), y0=Math.max(0,Math.floor(y-m));
  const x1=Math.min(maskA.width, Math.ceil(x+m)+1), y1=Math.min(maskA.height, Math.ceil(y+m)+1);
  if(x1<=x0||y1<=y0) return false;
  const d=mctx(maskA).getImageData(x0,y0,x1-x0,y1-y0).data;
  const w=x1-x0;
  for(let j=0;j<y1-y0;j++) for(let i=0;i<w;i++){
    if(d[(j*w+i)*4+3]>=A_ON){ const dx=x0+i-x, dy=y0+j-y; if(dx*dx+dy*dy<=m*m) return true; }
  }
  return false;
}
// 누른 자리에 있는 확정 구역(나중 것 먼저)
function hitRegion(x,y){
  const hc=mctx(hitC);
  for(let i=regions.length-1;i>=0;i--){
    const rg=regions[i], b=strokesBBox(rg.strokes);
    if(!b || x<b.x0-2 || x>b.x1+2 || y<b.y0-2 || y>b.y1+2) continue;
    hc.setTransform(1,0,0,1,0,0); hc.clearRect(0,0,5,5);
    hc.setTransform(1,0,0,1,2-x,2-y);
    paintStrokes(hc, rg.strokes);
    hc.setTransform(1,0,0,1,0,0);
    const d=hc.getImageData(1,1,3,3).data;
    for(let k=3;k<d.length;k+=4) if(d[k]>=A_ON) return rg;
  }
  return null;
}
function inImage(x,y){ return x>=0&&y>=0&&x<M.img_w&&y<M.img_h; }

function enterEdit(rg){
  active={strokes:rg.strokes.map(s=>({...s, pts:s.pts.map(p=>p.slice())})), editId:rg.id, base:rg.strokes.length, empty:false};
  redrawActive(); setLabel(rg.labels[0]);

function beginStroke(x,y,r,erase){

const pointers=new Map();
let stroke=null, strokeT0=0, gest=null, editT0=0;
cv.addEventListener('pointerdown', e=>{
  if(!IMG) return;

    const now=performance.now();

    stroke=null; editT0=0; cursor=null;
    const [a,b]=[...pointers.values()];
    gest={d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, s:view.s, ox:view.ox, oy:view.oy};
    render(); return;
  }
  if(pointers.size>2 || gest) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  const [x,y]=toImg(e.offsetX,e.offsetY);
  cursor={x:e.offsetX, y:e.offsetY}; lastPos=cursor; editT0=0;
  const r=brushR();
  if(!active){
    if(!inImage(x,y)){ requestRender(); return; }
    const hit=hitRegion(x,y);
    if(hit){ enterEdit(hit); editT0=performance.now(); render(); return; }     // 만든 구역을 누르면 고치기
    if(tool==='erase'){ toast('지우개 — 고칠 구역을 먼저 눌러요 (새 구역은 칠하기로)'); requestRender(); return; }
    active={strokes:[], editId:null, base:0, empty:false};
    beginStroke(x,y,r,false); seekVideoAt(x); updateUI(); render(); return;
  }
  if(tool==='erase'){ beginStroke(x,y,r,true); render(); return; }               // 지우개는 어디서 시작해도 된다(바깥부터 깎기)
  if(active.empty ? inImage(x,y) : touchesActive(x,y,r)){ beginStroke(x,y,r,false); render(); return; }

});
cv.addEventListener('pointermove', e=>{

    return;
  }
  pointers.set(e.pointerId, {x:e.offsetX, y:e.offsetY});
  if(gest && pointers.size>=2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const f=Math.max(0.2, d/gest.d);
    view.s=gest.s*f;
    view.ox=cx-((gest.cx-gest.ox)/gest.s)*view.s;
    view.oy=cy-((gest.cy-gest.oy)/gest.s)*view.s;
    fitted=false; clampView(); requestRender(); return;
  }
  cursor={x:e.offsetX, y:e.offsetY}; lastPos=cursor;
  if(stroke && active){
    const [x,y]=toImg(e.offsetX,e.offsetY);
    const p=stroke.pts[stroke.pts.length-1];
    if(Math.hypot(x-p[0],y-p[1])>=Math.max(0.7, stroke.r*0.25)) stampSeg(stroke, x, y);
  }

});
function endPointer(e){
  pointers.delete(e.pointerId);

}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', e=>{ if(e.pointerType!=='touch' && !pointers.size){ cursor=null; requestRender(); } });
cv.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.deltaY<0?1.2:1/1.2, e.offsetX, e.offsetY); }, {passive:false});
function dropStroke(s){
  if(!active) return;
  const i=active.strokes.indexOf(s); if(i>=0) active.strokes.splice(i,1);
  if(!active.strokes.length) active=null;
  redrawActive(); if(active) active.empty=maskEmpty(); updateUI(); render();
}

$('zIn').onclick=()=>{ const vb=viewBox(); zoomAt(1.5, vb.x+vb.w/2, vb.y+vb.h/2); };
$('zOut').onclick=()=>{ const vb=viewBox(); zoomAt(1/1.5, vb.x+vb.w/2, vb.y+vb.h/2); };
$('zFit').onclick=()=>{
  // 전체 보기(가로 맞춤) ↔ 꽉 채움(세로 맞춤 · 0 m 부터) — 긴 관은 전체 보기가 가는 띠라 번갈아 쓴다

// 전개도 칸 크기가 바뀌면(창 · 탭 돌리기 · 아래 판 높이) 캔버스를 다시 잡는다 — 전체 보기였으면 다시 맞춘다

function stepBrush(d){ const s=$('brush'); s.value=String(Math.max(0, Math.min(100, +s.value + d*BRUSH_STEP))); s.dispatchEvent(new Event('input')); }
function updateBrushDot(){

// ── 영상 — 그 station 을 가장 잘 찍은 장면으로 ────────────────────
// 거꾸로, 지금 영상이 보는 자리를 전개도 위 ▼ 로 — 카메라 위치 + 표본 띠 가운데(build.py frame_z · view_mm).
// 대충의 자리다: 영상 한 장은 앞으로 1~1.6 m 띠를 고루 보지만 그 가운데를 찍는다
function updateVidPos(){
  if(!M || !M.frame_z) return;
  const v=$('vid'), f=Math.max(0, Math.min(M.frame_z.length-1, Math.round((v.currentTime||0)*M.play_fps)));
  const vm=M.view_mm||[1000,1600];
  const x=Math.max(0, Math.min(M.img_w, (M.frame_z[f]+(vm[0]+vm[1])/2)/M.mm_per_px_x));
  if(vidX===null || Math.abs(x-vidX)*view.s>0.3){ vidX=x; requestRender(); }
}
function drawVidArrow(vb){
  if(vidX===null) return;
  const x=view.ox+vidX*view.s; if(x<vb.x-1 || x>vb.x+vb.w+1) return;
  const y=Math.max(vb.y, view.oy);                // 그림 위 끝 — 확대로 위가 잘렸으면 보이는 위 끝
  g.save(); g.fillStyle='#58a6ff'; g.strokeStyle='#07090d'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x-6, y-11); g.lineTo(x+6, y-11); g.closePath(); g.fill(); g.stroke();
  g.restore();
}
{ const v=$('vid');
  ['timeupdate','seeked','loadedmetadata'].forEach(ev=>v.addEventListener(ev, updateVidPos));
  // 재생 중엔 프레임마다(되는 브라우저만 — 크롬은 된다). 멈춰 있으면 불리지 않으니 한 번만 걸어 둔다
  if(v.requestVideoFrameCallback){ const tick=()=>{ updateVidPos(); v.requestVideoFrameCallback(tick); }; v.requestVideoFrameCallback(tick); }
}
function seekVideoAt(x){
  const k=Math.max(0, Math.min(M.nz-1, Math.floor(x*M.mm_per_px_x/M.z_bin_mm)));
  const t=M.station_t[k]; const v=$('vid');
  const go=()=>{ try{ v.pause(); v.currentTime=t; }catch(e){} };
  if(v.readyState>=1) go(); else v.addEventListener('loadedmetadata', go, {once:true});
  const mm=Math.floor(t/60), ss=Math.floor(t%60);
  $('vidHint').textContent=`— ${(k*M.z_bin_mm/1000).toFixed(2)} m 자리 → ${mm}:${String(ss).padStart(2,'0')} 쯤 (멀리서부터 보려면 조금 앞으로)`;
}

// ── 라벨(하나만) · 확정 · 취소 · 되돌리기 ──────────────────────────
function checkedLabel(){ const i=document.querySelector('#labelBoxes input:checked'); return i?i.value:null; }
function syncChecks(){ document.querySelectorAll('#labelBoxes input').forEach(i=>i.parentElement.classList.toggle('on', i.checked)); }
function setLabel(k){ document.querySelectorAll('#labelBoxes input').forEach(i=>{ i.checked=(i.value===k); }); syncChecks(); }
function resetLabel(){ setLabel(DEFAULT_LABEL); }   // 구역이 끝나면 기본 라벨(부식)로 돌아간다
function endActive(){ active=null; redrawActive(); resetLabel(); if(pendingSync) setTimeout(syncFromStorage, 0); }

function confirmActive(){
  if(!active){ toast('먼저 전개도를 눌러 구역을 만들어요'); return; }
  const lab=checkedLabel();
  if(!lab){ toast('라벨을 하나 골라요'); return; }
  if(maskEmpty()){
    // 다 깎아 없앴다 — 고치던 구역이면 지우고, 새 구역이면 버린다
    const id=active.editId; endActive();
    if(id){ deleteRegion(id); toast('다 지워서 구역을 없앴어요', true); }
    else { updateUI(); render(); toast('빈 구역이라 버렸어요'); }
    return;
  }
  let rg, old=[];
  if(active.editId){
    rg=regions.find(x=>x.id===active.editId); old=rg.labels;
    rg.strokes=active.strokes; rg.labels=[lab]; rg.edited_at=new Date().toISOString();
  } else {
    rg={id:Date.now(), labels:[lab], strokes:active.strokes, at:new Date().toISOString()};
    regions.push(rg);
  }
  const wasEdit=!!active.editId;
  computeRegionArea(rg); endActive();
  for(const k of new Set([...old, lab])) rebuildLayer(k);
  rebuildUnion(); regVer++; changed(); updateUI(); render();
  toast(`${wasEdit?'고침':'완료'} — ${LBY[lab].ko} ${rg.pct.toFixed(2)}%`, true);
}
$('btnV').onclick=confirmActive;
$('btnX').onclick=()=>{ if(!active) return; endActive(); updateUI(); render(); };
function undo(){
  if(!active) return;
  if(active.strokes.length<=active.base){ toast('고치기 전 그대로예요 — ✕ 로 고치기를 끝내요'); return; }
  active.strokes.pop();
  if(!active.strokes.length) active=null;           // 새 구역의 첫 점까지 되돌리면 구역이 없어진다
  redrawActive(); if(active) active.empty=maskEmpty();
  updateUI(); render();
}
$('btnUndo').onclick=undo;
// 키보드 — 한 손은 키보드, 한 손은 화면 (2026-10-02 사용자)
//   ⌫ · Ctrl+Z = 되돌리기 · Enter = ✓ 완료 · + / − = 붓 크기
window.addEventListener('keydown', e=>{
  const t=e.target;
  if(t && (t.tagName==='TEXTAREA' || (t.tagName==='INPUT' && /^(text|search|number|email|url|password)$/.test(t.type)))) return;
  if(e.ctrlKey || e.metaKey || e.altKey){
    if((e.ctrlKey||e.metaKey) && !e.altKey && !e.shiftKey && (e.key==='z'||e.key==='Z')){ e.preventDefault(); undo(); }
    if((e.ctrlKey||e.metaKey) && !e.altKey && (e.key==='s'||e.key==='S')){ e.preventDefault(); doSave(); }   // 브라우저 '페이지 저장' 창 대신
    return;                                           // Ctrl + / − 는 브라우저 확대 그대로
  }
  if(e.key==='Backspace'){ e.preventDefault(); undo(); return; }
  if(e.key==='Enter'){ e.preventDefault(); if(active) confirmActive(); return; }   // 버튼에 초점이 있어도 두 번 눌리지 않게
  if(e.key==='+' || e.key==='='){ e.preventDefault(); stepBrush(+1); return; }
  if(e.key==='-' || e.key==='_'){ e.preventDefault(); stepBrush(-1); return; }
});

function deleteRegion(id){
  const i=regions.findIndex(r=>r.id===id); if(i<0) return;
  if(active && active.editId===id) endActive();
  const labs=regions[i].labels; tomb.add(id); regions.splice(i,1);
  for(const k of labs) rebuildLayer(k);
  rebuildUnion(); regVer++; changed(); updateUI(); render();
}
$('btnClear').onclick=()=>{
  if(!regions.length) return;
  if(!confirm(`${M.title} 의 구역 ${regions.length}개를 전부 지울까요?`)) return;
  if(active && active.editId) endActive();

};

// ── 면적 — 라벨마다 합집합(같은 라벨은 겹쳐도 한 번), 분모 = 본 화소 ─
function countSeenBox(canvas, b){
  const w=b.x1-b.x0, h=b.y1-b.y0; if(w<=0||h<=0) return 0;
  const d=mctx(canvas).getImageData(b.x0,b.y0,w,h).data; let n=0;
  for(let j=0;j<h;j++){ const row=(b.y0+j)*M.img_w+b.x0, o=j*w;
    for(let i=0;i<w;i++){ if(SEEN[row+i] && d[(o+i)*4+3]>=A_ON) n++; } }
  return n;
}
const FULL=()=>({x0:0,y0:0,x1:M.img_w,y1:M.img_h});
function paintInto(c, rs){
  const cc=mctx(c); cc.setTransform(1,0,0,1,0,0); cc.clearRect(0,0,c.width,c.height);
  paintGroups(cc, rs.map(r=>r.strokes), scratch, [1,0,0,1,0,0]);
}
function rebuildLayer(key){
  const rs=regions.filter(r=>r.labels.includes(key));
  if(!rs.length){ counts[key]=0; return; }
  paintInto(work, rs); counts[key]=countSeenBox(work, FULL());
}
function rebuildUnion(){
  if(!regions.length){ unionCount=0; return; }
  paintInto(work, regions); unionCount=countSeenBox(work, FULL());
}
function rebuildAll(){ for(const l of LABELS) rebuildLayer(l.key); rebuildUnion(); }
function pxArea(){ return M.mm_per_px_x*M.mm_per_px_y/1e6; }   // m² / 화소
function computeRegionArea(rg){
  const b=strokesBBox(rg.strokes); let n=0;
  if(b){ const c=mctx(scratch); c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,scratch.width,scratch.height); paintStrokes(c, rg.strokes); n=countSeenBox(scratch,b); }
  rg.area_m2=+(n*pxArea()).toFixed(4); rg.pct=seenCount?+(100*n/seenCount).toFixed(3):0;
}

// ── 화면 갱신 ──────────────────────────────────────────────────────
function toast(msg, good){ const t=$('toast'); t.textContent=msg; t.className='on'+(good?' good':''); clearTimeout(toast._t); toast._t=setTimeout(()=>t.className='',1800); }
function fmtCm(cm){ return cm<1 ? cm.toFixed(1) : cm.toFixed(0); }
function updateUI(){
  if(!M) return;
  $('tPaint').setAttribute('aria-pressed', String(tool==='paint'));
  $('tErase').setAttribute('aria-pressed', String(tool==='erase'));
  const mm=(M.mm_per_px_x+M.mm_per_px_y)/2;
  $('brushCm').textContent=`지름 ≈ ${fmtCm(2*brushR()*mm/10)} cm`;
  updateBrushDot();
  const editNo = active&&active.editId ? regions.findIndex(x=>x.id===active.editId)+1 : 0;
  $('regState').textContent = !active ? '전개도를 누르면 새 구역 · 만든 구역을 누르면 고치기'

  $('btnUndo').disabled=!active||active.strokes.length<=active.base;

  const cleanPct=seenCount?100*(seenCount-unionCount)/seenCount:100;
  const rows=[{...CLEAN, pct:cleanPct, m2:(seenCount-unionCount)*pxArea()}]
    .concat(LABELS.map(l=>({...l, pct:pct(l.key), m2:(counts[l.key]||0)*pxArea()})));
  $('bars').innerHTML=rows.map(x=>`<div class="bar${x.pct>0?' lead':''}"><span><i class="sw" style="background:${x.color};vertical-align:-2px"></i> ${x.ko}</span>
      <div class="trk"><div class="fill" style="width:${x.pct.toFixed(2)}%;background:${x.color}"></div></div>
      <span class="num">${x.pct.toFixed(x.key==='clean'?1:2)}% · ${x.m2.toFixed(2)} m²</span></div>`).join('');
  // 구역 목록 — 누르면 고친다
  $('nReg').textContent=regions.length?`${regions.length}개`:'— 아직 없음';
  $('regList').innerHTML=regions.map((rg,i)=>{ const ed=active&&active.editId===rg.id; return `<li class="${ed?'sel':''}" data-id="${rg.id}">
      <span class="t">${i+1}. ${rg.labels.map(k=>`<i class="sw" style="background:${LBY[k].color};vertical-align:-2px"></i> ${LBY[k].ko}`).join(' · ')}
      <span class="hint">${(rg.pct||0).toFixed(2)}% · ${(rg.area_m2||0).toFixed(2)} m²${ed?' · 고치는 중':''}</span></span>
      <button class="del">지우기</button></li>`; }).join('');
  $('regList').querySelectorAll('li').forEach(li=>{
    li.onclick=e=>{
      if(e.target.classList.contains('del')) return;
      const id=+li.dataset.id, rg=regions.find(x=>x.id===id); if(!rg) return;
      if(active){ if(active.editId!==id) toast('지금 구역을 먼저 ✓ 또는 ✕'); return; }
      enterEdit(rg); centerOn(rg); render();
    };
    li.querySelector('.del').onclick=()=>{ const id=+li.dataset.id; const rg=regions.find(x=>x.id===id); if(rg && confirm(`${rg.labels.map(k=>LBY[k].ko).join('·')} 구역을 지울까요?`)) deleteRegion(id); };
  });
  showSaveState();
}
function centerOn(rg){
  const b=strokesBBox(rg.strokes); if(!b) return;
  const vb=viewBox(); view.ox=vb.x+vb.w/2-(b.x0+b.x1)/2*view.s; view.oy=vb.y+vb.h/2-(b.y0+b.y1)/2*view.s; fitted=false; clampView();
}

// ── 내보내기 · 불러오기 ────────────────────────────────────────────
function exportJSON(){
  const per={}; for(const l of LABELS) per[l.key]={ko:l.ko, pct:+(seenCount?100*(counts[l.key]||0)/seenCount:0).toFixed(3), m2:+((counts[l.key]||0)*pxArea()).toFixed(4)};
  return {
    format:'pipe-label/2', dataset:M.name, title:M.title, video_label:M.label, exported_at:new Date().toISOString(), labeler:labeler(false)||undefined,
    pipe_dia_mm:M.pipe_dia_mm, len_mm:M.len_mm, img:{w:M.img_w,h:M.img_h, mm_per_px_x:M.mm_per_px_x, mm_per_px_y:M.mm_per_px_y},
    denominator:{seen_m2:+(seenCount*pxArea()).toFixed(4), note:'계기가 본 화소(q4≥4)만 센다 · 칠한 곳 중 못 본 화소는 면적에서 뺀다'},
    strokes_note:'구역마다 strokes 를 순서대로 그린다(지름 = 2r, 둥근 끝). erase=true 는 지우개 — 그 구역 안에서만 깎는다. 좌표 = 전개도 그림 화소(가로 관 길이 · 세로 둘레)',
    summary:{clean_pct:+(seenCount?100*(seenCount-unionCount)/seenCount:100).toFixed(3), per_label:per},
    regions:regions.map(r=>({id:r.id, labels:r.labels, area_m2:r.area_m2, pct:r.pct, at:r.at, ...(r.edited_at?{edited_at:r.edited_at}:{}), strokes:r.strokes})),
    ua:navigator.userAgent,
  };
}
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function snapshotBlob(){
  // 전개도 전체 + 구역(옅은 채움 + 안쪽 테두리)을 그림으로 — 사람이 바로 볼 수 있게
  const W=M.img_w, H=M.img_h;
  const c=mkCanvas(W,H), cc=c.getContext('2d'); cc.drawImage(IMG,0,0);
  const t=mkCanvas(W,H), e=mkCanvas(W,H), o=mkCanvas(W,H);
  for(const l of LABELS){
    const rs=regions.filter(r=>r.labels.includes(l.key)); if(!rs.length) continue;
    const tg=t.getContext('2d'); tg.setTransform(1,0,0,1,0,0); tg.clearRect(0,0,W,H);
    paintGroups(tg, rs.map(r=>r.strokes), scratch, [1,0,0,1,0,0]);
    tg.globalCompositeOperation='source-in'; tg.fillStyle=l.color; tg.fillRect(0,0,W,H); tg.globalCompositeOperation='source-over';
    innerOutline(t,e,o,2);
    cc.globalAlpha=0.35; cc.drawImage(t,0,0); cc.globalAlpha=1; cc.drawImage(o,0,0);
  }
  return new Promise(res=>c.toBlob(res,'image/png'));
}
$('btnShare').onclick=async()=>{
  if(!regions.length){ toast('아직 완료한 구역이 없어요'); return; }
  const name=`라벨_${M.name}_${stamp()}`;
  const txt=JSON.stringify(exportJSON(),null,1);
  const jf=new File([txt], name+'.json', {type:'application/json'});
  // 안드로이드 크롬은 .json 공유를 막는다(허용 목록에 없음) — 공유창에는 같은 내용을 글 파일(.txt)로 보낸다. 불러오기에서 그대로 읽힌다
  const tf=new File([txt], name+'.txt', {type:'text/plain'});
  const pf=new File([await snapshotBlob()], name+'.png', {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[tf,pf]})){
    try{ await navigator.share({files:[tf,pf], title:name, text:`${M.title} 라벨링 결과`}); toast('보냈어요', true); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  for(const f of [jf,pf]){ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }
  toast('다운로드 폴더에 저장했어요 (json · png)', true);
};
$('btnCopy').onclick=async()=>{
  try{ await navigator.clipboard.writeText(JSON.stringify(exportJSON())); toast('복사했어요', true); }
  catch(e){ toast('복사 실패 — 보내기를 써요'); }
};
$('fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      if(!/^pipe-label\/[12]$/.test(j.format) || !Array.isArray(j.regions)) throw new Error('형식');
      if(j.dataset!==M.name && !confirm(`이 파일은 ${j.title||j.dataset} 것입니다. 지금 탭(${M.title})에 불러올까요?`)) return;
      if(regions.length && !confirm(`지금 구역 ${regions.length}개를 지우고 파일의 ${j.regions.length}개로 바꿀까요?`)) return;
      endActive();
      const incoming=j.regions.map(normRegion).filter(Boolean), keep=new Set(incoming.map(r=>r.id));
      for(const r of regions) if(!keep.has(r.id)) tomb.add(r.id);
      for(const id of keep) tomb.delete(id);
      regions=incoming;
      for(const rg of regions) computeRegionArea(rg);
      rebuildAll(); regVer++; changed(); updateUI(); render();
      toast(`불러왔어요 — 구역 ${regions.length}개`, true);
    }catch(err){ toast('JSON 을 못 읽었어요'); }
    e.target.value='';
  };
  rd.readAsText(f);
};

// 닫기 · 숨기기 — 바뀐 게 있을 때만 쓴다(옛 탭이 빈 내용으로 덮는 일을 막는다)
window.addEventListener('beforeunload', ()=>saveNow());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveNow(); });
init().catch(err=>{ $('saveState').textContent='자료를 못 열었다: '+err; });
</script>
